<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>

        /*
        Se necesita que el programa solicite al usuario el ingreso 
        de un número y el sistema mostrara en etiquetas H1 los número 
        en forma descendente hasta el 0 
        */

        var numero = prompt("Ingrese un numero")

        for (let index = numero; index >= 0; index--) {
            document.write(`<h1>${index}</h1>`);
        }

    </script>

</body>

</html>
